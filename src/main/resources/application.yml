server:
  port: 8765
jwt:
  token:
    # Shared with user-service (JWT_SECRET) and socket-gateway.
    # MUST be set in production - the default below is for local dev only.
    secret: ${JWT_SECRET:dev-only-change-me}
internal:
  hmac:
    # Shared secret for signing X-Current-User between gateway and backend
    # services (INTERNAL_HMAC_SECRET). MUST be set in production.
    secret: ${INTERNAL_HMAC_SECRET:dev-only-change-me}
spring:
  application:
    name: ApiGateway
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: friend-service
          uri: lb://friend-service
          predicates:
            - Path=/api/v1/friends/**
        - id: message-service
          uri: lb://message-service
          predicates:
            - Path=/api/v1/messages/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
        - id: blob-service
          uri: lb://blob-service
          predicates:
            - Path=/api/v1/blobs/**
        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/api/v1/posts/**
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/v1/comments/**
        - id: group-service
          uri: lb://group-service
          predicates:
            - Path=/api/v1/groups/**
        - id: page-service
          uri: lb://page-service
          predicates:
            - Path=/api/v1/pages/**
        - id: reaction-service
          uri: lb://reaction-service
          predicates:
            - Path=/api/v1/reactions/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      httpclient:
        connect-timeout: 5000 
        response-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive.function.client: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

app:
  excluded-paths:
    - /api/v1/users/login
    - /api/v1/users/register
    - /api/v1/users/refresh-token